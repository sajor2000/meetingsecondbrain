name: RecallOS
options:
  bundleIdPrefix: com.recallos
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  RecallOSCore:
    path: packages/RecallOSCore
  ConvexSwift:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RecallOSMac:
    type: application
    platform: macOS
    sources:
      - apps/Shared/Sources
      - apps/RecallOSMac/Sources
    resources:
      - apps/RecallOSMac/Resources
    dependencies:
      - package: RecallOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recallos.mac
        INFOPLIST_FILE: apps/RecallOSMac/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ONLY_ACTIVE_ARCH: YES
  RecallOSiOS:
    type: application
    platform: iOS
    sources:
      - apps/Shared/Sources
      - apps/RecallOSiOS/Sources
      - path: apps/RecallOSiOS/Resources/LaunchScreen.storyboard
    dependencies:
      - package: RecallOSCore
      - package: ConvexSwift
        product: ConvexMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recallos.ios
        INFOPLIST_FILE: apps/RecallOSiOS/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
        ONLY_ACTIVE_ARCH: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
schemes:
  RecallOSMac:
    build:
      targets:
        RecallOSMac: all
    run:
      config: Debug
  RecallOSiOS:
    build:
      targets:
        RecallOSiOS: all
    run:
      config: Debug
